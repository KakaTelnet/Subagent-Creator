name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: python3 -m venv venv

      - name: Install validation dependencies
        run: |
          source ./venv/bin/activate
          which python3
          which pip3
          python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run regression tests
        run: |
          source ./venv/bin/activate
          which python3
          which pip3
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check Python syntax
        run: |
          source ./venv/bin/activate
          which python3
          which pip3
          python3 -m py_compile scripts/check_official_codex_schema.py scripts/check_official_plugin_schema.py scripts/validate_plugin.py skills/subagent-creator/scripts/validate_team.py tests/test_check_official_codex_schema.py tests/test_validate_plugin.py tests/test_validate_team.py tests/test_representative_fixture.py tests/test_repository_layout.py

      - name: Validate Skill package
        run: |
          source ./venv/bin/activate
          agentskills validate skills/subagent-creator

      - name: Validate Plugin package
        run: |
          source ./venv/bin/activate
          python3 scripts/validate_plugin.py .

      - name: Check current official Plugin schema compatibility
        run: |
          source ./venv/bin/activate
          python3 scripts/check_official_plugin_schema.py

      - name: Check current official Codex schema compatibility
        run: |
          source ./venv/bin/activate
          python3 scripts/check_official_codex_schema.py
