name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: python3 -m venv venv

      - name: Install validation dependencies
        run: |
          source ./venv/bin/activate
          which python3
          which pip3
          python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run regression tests
        run: |
          source ./venv/bin/activate
          which python3
          which pip3
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check Python syntax
        run: |
          source ./venv/bin/activate
          which python3
          which pip3
          python3 -m py_compile scripts/validate_plugin.py skills/construct-subagent/scripts/validate_team.py tests/test_validate_plugin.py tests/test_validate_team.py tests/test_repository_layout.py

      - name: Validate Skill package
        run: |
          source ./venv/bin/activate
          agentskills validate skills/construct-subagent

      - name: Validate Plugin package
        run: |
          source ./venv/bin/activate
          python3 scripts/validate_plugin.py .
