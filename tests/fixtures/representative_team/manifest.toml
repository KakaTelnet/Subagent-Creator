schema_version = 4
generator = "subagent-creator"
status = "ready"
last_changed_at = "2026-08-13T20:00:00+08:00"
scope = "project"

[context]
summary = "Representative mixed-permission implementation team."
artifact_paths = ["artifact.txt"]
constraints = ["Preserve user-managed Agents."]

[orchestration]
max_concurrent_agents = 2
parallel_policy = ["Independent verification may run beside isolated implementation."]
serial_policy = ["Serialize dependent exploration and implementation."]
failure_flow = ["Worker BLOCKED -> main", "Verifier FAILED -> main"]

[[model_registry.models]]
id = "economy-model"
availability_source = "project_model_allowlist"
capability_tier = "throughput"
cost_tier = "low"
reasoning_efforts = ["low", "medium"]
suitable_for = ["exploration", "implementation", "testing"]

[[model_registry.models]]
id = "strong-model"
availability_source = "project_model_allowlist"
capability_tier = "strong"
cost_tier = "high"
reasoning_efforts = ["high", "medium"]
suitable_for = ["architecture decisions", "complex debugging"]

[[agents]]
name = "code_mapper"
file = ".codex/agents/code-mapper.toml"
description = "Read-only explorer for mapping implementation paths."
model = "economy-model"
model_reasoning_effort = "low"
escalation_model = "strong-model"
escalation_reasoning_effort = "high"
sandbox_mode = "read-only"
skills = []
invoke_when = ["Before implementation in an unfamiliar module"]
serializes_with = ["implementation_worker"]
cost_tier = "low"
managed = true

[[agents]]
name = "implementation_worker"
file = ".codex/agents/implementation-worker.toml"
description = "Implementation worker for bounded changes."
model = "economy-model"
model_reasoning_effort = "medium"
escalation_model = "strong-model"
escalation_reasoning_effort = "high"
sandbox_mode = "workspace-write"
skills = []
invoke_when = ["After the implementation path is known"]
serializes_with = ["code_mapper"]
cost_tier = "low"
managed = true
